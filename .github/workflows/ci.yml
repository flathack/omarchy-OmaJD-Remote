name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install QML validation tools
        run: sudo apt-get update && sudo apt-get install --yes qt6-declarative-dev-tools
      - run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - run: REQUIRE_QML_TOOLS=1 REQUIRE_BROWSER_TESTS=1 ./scripts/check.sh
