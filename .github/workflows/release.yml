name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  qml-semantic:
    runs-on: ubuntu-24.04
    container: archlinux:base@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
    steps:
      - run: sed -i 's|^Server = .*|Server = https://archive.archlinux.org/repos/2026/09/01/$repo/os/$arch|' /etc/pacman.d/mirrorlist
      - run: pacman -Syu --noconfirm git qt6-declarative quickshell weston
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          git init /tmp/omarchy
          git -C /tmp/omarchy remote add origin https://github.com/basecamp/omarchy.git
          git -C /tmp/omarchy fetch --depth 1 origin d3d23fdddef846ebb98b52122a6ece66211c0daf
          git -C /tmp/omarchy checkout --detach FETCH_HEAD
      - env:
          OMARCHY_SHELL_SOURCE: /tmp/omarchy/shell
        run: |
          ./scripts/check-qml.sh
          export XDG_RUNTIME_DIR=/tmp/omajdownload-runtime
          install -d -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-omajdownload --idle-time=0 >/tmp/weston.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid"' EXIT
          attempt=0
          while [ "$attempt" -lt 50 ]; do
            [ -S "$XDG_RUNTIME_DIR/wayland-omajdownload" ] && break
            sleep 0.1
            attempt=$((attempt + 1))
          done
          WAYLAND_DISPLAY=wayland-omajdownload QT_QPA_PLATFORM=wayland ./scripts/qml-runtime-smoke.sh

  browser-e2e:
    runs-on: ubuntu-24.04
    container: archlinux:base@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
    steps:
      - run: sed -i 's|^Server = .*|Server = https://archive.archlinux.org/repos/2026/09/01/$repo/os/$arch|' /etc/pacman.d/mirrorlist
      - run: >-
          pacman -Syu --noconfirm
          chromium firefox geckodriver python python-pip
          xorg-server-xvfb openssl zip unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          python -m venv --system-site-packages /tmp/omajdownload-e2e
          /tmp/omajdownload-e2e/bin/pip install --disable-pip-version-check --require-hashes -r requirements.lock
          /tmp/omajdownload-e2e/bin/pip install --disable-pip-version-check --require-hashes -r tests/requirements.lock
          ./scripts/build-extension.sh
      - env:
          RUN_BROWSER_E2E: "1"
          MOZ_DISABLE_CONTENT_SANDBOX: "1"
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid"' EXIT
          OMAJDOWNLOAD_E2E_BROWSER=chromium DISPLAY=:99 /tmp/omajdownload-e2e/bin/python tests/browser_extension_e2e.py -v
          install -d -m 700 /tmp/firefox-home /tmp/firefox-runtime
          OMAJDOWNLOAD_E2E_BROWSER=firefox env -u DISPLAY HOME=/tmp/firefox-home XDG_RUNTIME_DIR=/tmp/firefox-runtime /tmp/omajdownload-e2e/bin/python tests/browser_extension_e2e.py -v

  release:
    needs: [qml-semantic, browser-e2e]
    runs-on: ubuntu-24.04
    container: archlinux:base@sha256:82b1b08faae9d61e3e7e13d562f4d09114d939105b0d59ff34140f3bd418593a
    permissions:
      contents: write
    steps:
      - run: sed -i 's|^Server = .*|Server = https://archive.archlinux.org/repos/2026/09/01/$repo/os/$arch|' /etc/pacman.d/mirrorlist
      - run: pacman -Syu --noconfirm diffutils git github-cli nodejs python python-pip qt6-declarative shellcheck zip unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install validation tools
        run: |
          python -m venv /tmp/omajdownload-release
          /tmp/omajdownload-release/bin/pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Verify tag and source
        run: |
          /tmp/omajdownload-release/bin/python scripts/verify_release.py --tag "$GITHUB_REF_NAME"
          PYTHON_BIN=/tmp/omajdownload-release/bin/python REQUIRE_QML_TOOLS=1 REQUIRE_BROWSER_TESTS=1 ./scripts/check.sh
      - name: Build reproducible browser packages
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./scripts/build-extension.sh
          mkdir first-build
          cp dist/*.zip first-build/
          ./scripts/build-extension.sh
          cmp first-build/omajd-remote-clicknload-chromium.zip dist/omajd-remote-clicknload-chromium.zip
          cmp first-build/omajd-remote-clicknload-firefox.zip dist/omajd-remote-clicknload-firefox.zip
          git rev-parse HEAD > dist/SOURCE_REVISION
          (cd dist && sha256sum *.zip SOURCE_REVISION > SHA256SUMS)
      - name: Publish tagged artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/omajd-remote-clicknload-chromium.zip
          dist/omajd-remote-clicknload-firefox.zip
          dist/SHA256SUMS
          dist/SOURCE_REVISION
          --verify-tag --generate-notes --title "OmaJD-Remote $GITHUB_REF_NAME"
