name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  qml-semantic:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm git qt6-declarative quickshell weston
      - uses: actions/checkout@v7
      - run: git clone --depth 1 --branch quattro https://github.com/basecamp/omarchy.git /tmp/omarchy
      - env:
          OMARCHY_SHELL_SOURCE: /tmp/omarchy/shell
        run: |
          ./scripts/check-qml.sh
          export XDG_RUNTIME_DIR=/tmp/omajdownload-runtime
          install -d -m 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-omajdownload --idle-time=0 >/tmp/weston.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid"' EXIT
          attempt=0
          while [ "$attempt" -lt 50 ]; do
            [ -S "$XDG_RUNTIME_DIR/wayland-omajdownload" ] && break
            sleep 0.1
            attempt=$((attempt + 1))
          done
          WAYLAND_DISPLAY=wayland-omajdownload QT_QPA_PLATFORM=wayland ./scripts/qml-runtime-smoke.sh

  browser-e2e:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - run: >-
          pacman -Syu --noconfirm
          chromium firefox geckodriver python python-pip
          xorg-server-xvfb openssl zip unzip
      - uses: actions/checkout@v7
      - run: |
          python -m venv --system-site-packages /tmp/omajdownload-e2e
          /tmp/omajdownload-e2e/bin/pip install --disable-pip-version-check --require-hashes -r requirements.lock
          /tmp/omajdownload-e2e/bin/pip install --disable-pip-version-check selenium==4.35.0
          ./scripts/build-extension.sh
      - env:
          RUN_BROWSER_E2E: "1"
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid"' EXIT
          DISPLAY=:99 /tmp/omajdownload-e2e/bin/python tests/browser_extension_e2e.py -v

  release:
    needs: [qml-semantic, browser-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes qt6-declarative-dev-tools shellcheck zip unzip
          python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
      - name: Verify tag and source
        run: |
          python scripts/verify_release.py --tag "$GITHUB_REF_NAME"
          REQUIRE_QML_TOOLS=1 REQUIRE_BROWSER_TESTS=1 ./scripts/check.sh
      - name: Build reproducible browser packages
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          ./scripts/build-extension.sh
          mkdir first-build
          cp dist/*.zip first-build/
          ./scripts/build-extension.sh
          cmp first-build/omajdownload-clicknload-chromium.zip dist/omajdownload-clicknload-chromium.zip
          cmp first-build/omajdownload-clicknload-firefox.zip dist/omajdownload-clicknload-firefox.zip
          git rev-parse HEAD > dist/SOURCE_REVISION
          (cd dist && sha256sum *.zip SOURCE_REVISION > SHA256SUMS)
      - name: Publish tagged artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/omajdownload-clicknload-chromium.zip
          dist/omajdownload-clicknload-firefox.zip
          dist/SHA256SUMS
          dist/SOURCE_REVISION
          --verify-tag --generate-notes --title "OmaJDownLoad $GITHUB_REF_NAME"
