<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">OmaJD-Remote mark</title>
  <desc id="desc">A download arrow inside an open circular transfer path</desc>
  <defs>
    <linearGradient id="ring" x1="18" y1="14" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76d7ff"/>
      <stop offset="1" stop-color="#7c6cff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#111827" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#151821"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M95 29A45 45 0 1 0 105 83" stroke="url(#ring)" stroke-width="10"/>
    <path d="m96 20-1 19-18-6" stroke="#76d7ff" stroke-width="8"/>
    <path d="M64 35v45m-17-15 17 18 17-18" stroke="#f4f7ff" stroke-width="10"/>
  </g>
</svg>
