<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="70" y1="40" x2="1100" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161b28"/>
      <stop offset="1" stop-color="#090c13"/>
    </linearGradient>
    <linearGradient id="signal" x1="70" y1="80" x2="520" y2="545" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78dcff"/>
      <stop offset="1" stop-color="#8676ff"/>
    </linearGradient>
    <linearGradient id="progress" x1="720" y1="0" x2="1050" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78dcff"/>
      <stop offset="1" stop-color="#8676ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".48"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="675" rx="30" fill="url(#grid)"/>
  <circle cx="208" cy="214" r="138" fill="#4ecfff" opacity=".08" filter="url(#glow)"/>
  <path d="M396 73A250 250 0 1 0 464 494" fill="none" stroke="url(#signal)" stroke-width="3" stroke-opacity=".25" stroke-linecap="round"/>
  <path d="m401 62-4 25-24-8" fill="none" stroke="#78dcff" stroke-opacity=".36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(72 76)">
    <rect width="92" height="92" rx="22" fill="#171c29" stroke="#ffffff" stroke-opacity=".12"/>
    <path d="M70 21A32 32 0 1 0 77 60" fill="none" stroke="url(#signal)" stroke-width="7" stroke-linecap="round"/>
    <path d="m71 15-1 14-13-4" fill="none" stroke="#78dcff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46 25v34m-12-11 12 13 12-13" fill="none" stroke="#f4f7ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="JetBrains Mono, monospace">
    <text x="72" y="218" fill="#82dcff" font-size="15" font-weight="700" letter-spacing="3">OMARCHY QUATTRO PLUGIN</text>
    <text x="68" y="283" fill="#f4f7ff" font-size="48" font-weight="700">OmaJDownLoad</text>
    <text x="72" y="325" fill="#a8b0c2" font-size="20">remote downloads, right from the bar</text>

    <g transform="translate(72 382)" font-size="15">
      <rect width="154" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".11"/>
      <circle cx="23" cy="19" r="5" fill="#78dcff"/>
      <text x="39" y="25" fill="#dce3f1">multi-device</text>
      <rect x="168" width="168" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".11"/>
      <circle cx="191" cy="19" r="5" fill="#8676ff"/>
      <text x="207" y="25" fill="#dce3f1">keyring-secured</text>
    </g>

    <g transform="translate(72 482)">
      <text y="0" fill="#6f798e" font-size="13" letter-spacing="2">TRANSFER PATH</text>
      <path d="M0 27h408" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="7" cy="27" r="5" fill="#78dcff"/>
      <circle cx="205" cy="27" r="5" fill="#58637a"/>
      <circle cx="401" cy="27" r="5" fill="#8676ff"/>
      <text y="56" fill="#a8b0c2" font-size="13">LINKGRABBER</text>
      <text x="161" y="56" fill="#a8b0c2" font-size="13">QUEUE</text>
      <text x="337" y="56" fill="#a8b0c2" font-size="13">SERVER</text>
    </g>

    <g transform="translate(612 46)" filter="url(#shadow)">
      <rect width="516" height="583" rx="24" fill="#121722" stroke="#ffffff" stroke-opacity=".13"/>
      <rect x="1" y="1" width="514" height="66" rx="23" fill="#ffffff" fill-opacity=".025"/>
      <circle cx="34" cy="34" r="13" fill="none" stroke="#78dcff" stroke-width="3" stroke-dasharray="52 20"/>
      <path d="M34 26v15m-5-5 5 6 5-6" fill="none" stroke="#f4f7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="31" fill="#f4f7ff" font-size="18" font-weight="700">JDownloader@server</text>
      <text x="60" y="50" fill="#78dcff" font-size="11" font-weight="700" letter-spacing="1.5">RUNNING · 24.8 MB/S</text>
      <rect x="454" y="20" width="36" height="26" rx="13" fill="#78dcff" fill-opacity=".13" stroke="#78dcff" stroke-opacity=".45"/>
      <text x="472" y="38" text-anchor="middle" fill="#9ee7ff" font-size="13" font-weight="700">2</text>

      <text x="26" y="104" fill="#707b90" font-size="11" font-weight="700" letter-spacing="2">CONTROLS</text>
      <g transform="translate(26 119)" font-size="12" font-weight="700">
        <rect width="93" height="38" rx="9" fill="#78dcff" fill-opacity=".12" stroke="#78dcff" stroke-opacity=".5"/>
        <text x="47" y="24" text-anchor="middle" fill="#dff7ff">▶ START</text>
        <rect x="103" width="93" height="38" rx="9" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".12"/>
        <text x="150" y="24" text-anchor="middle" fill="#dce3f1">Ⅱ PAUSE</text>
        <rect x="206" width="88" height="38" rx="9" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".12"/>
        <text x="250" y="24" text-anchor="middle" fill="#dce3f1">■ STOP</text>
      </g>

      <path d="M26 180h464" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="26" y="210" fill="#707b90" font-size="11" font-weight="700" letter-spacing="2">DOWNLOADS</text>

      <g transform="translate(26 226)">
        <rect width="464" height="103" rx="13" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".1"/>
        <text x="16" y="29" fill="#f4f7ff" font-size="15" font-weight="700">archlinux-2026.08.iso</text>
        <text x="16" y="53" fill="#8b95a9" font-size="12">74% · 18.2 MB/s · 1.1 GB remaining</text>
        <rect x="16" y="72" width="432" height="7" rx="3.5" fill="#ffffff" fill-opacity=".08"/>
        <rect x="16" y="72" width="320" height="7" rx="3.5" fill="url(#progress)"/>
      </g>

      <g transform="translate(26 341)">
        <rect width="464" height="103" rx="13" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".1"/>
        <text x="16" y="29" fill="#f4f7ff" font-size="15" font-weight="700">project-archive.zip</text>
        <text x="16" y="53" fill="#8b95a9" font-size="12">41% · 6.6 MB/s · 3 links</text>
        <rect x="16" y="72" width="432" height="7" rx="3.5" fill="#ffffff" fill-opacity=".08"/>
        <rect x="16" y="72" width="177" height="7" rx="3.5" fill="url(#progress)"/>
      </g>

      <path d="M26 468h464" stroke="#ffffff" stroke-opacity=".09"/>
      <text x="26" y="498" fill="#707b90" font-size="11" font-weight="700" letter-spacing="2">ADD LINKS</text>
      <rect x="26" y="514" width="341" height="43" rx="10" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="42" y="541" fill="#687287" font-size="12">paste one or more links…</text>
      <rect x="377" y="514" width="113" height="43" rx="10" fill="#8676ff" fill-opacity=".2" stroke="#8676ff" stroke-opacity=".6"/>
      <text x="434" y="541" text-anchor="middle" fill="#e5e1ff" font-size="12" font-weight="700">ADD + START</text>
    </g>
  </g>
</svg>
